# Continuous integration.
#
# Three hosts, because a rule only one of them exercises is a rule that breaks
# on the other two without anybody hearing about it. macOS must be the x86_64
# image: the pinned gnat_native ships no aarch64-darwin binary.
#
# This crate depends on nothing but the compiler, so there is no sibling
# checkout here -- except for the release gate, which reads this repository
# with project_tools and therefore needs it beside us.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - name: Check out jsonlib
        uses: actions/checkout@v7
        with:
          path: jsonlib

      # The gate is its own crate and pins project_tools by path, so the
      # closure has to be here before anything resolves.
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: jsonlib

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently
        # dropping transitive crates.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        working-directory: jsonlib
        shell: bash
        run: alr --non-interactive build

      - name: Build the suite
        working-directory: jsonlib/tests
        shell: bash
        run: alr --non-interactive build

      - name: Run the suite
        working-directory: jsonlib/tests
        shell: bash
        run: |
          set -eu
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./bin/jsonlib_tests.exe
          else
            ./bin/jsonlib_tests
          fi

      - name: Build the release gate
        working-directory: jsonlib/check_jsonlib
        shell: bash
        run: alr --non-interactive build

      # It reads files and compares text, which is where a path separator and
      # a line ending differ, so it runs on every host rather than on Linux.
      - name: Run the release gate
        working-directory: jsonlib/check_jsonlib
        shell: bash
        run: |
          set -eu
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./bin/check_jsonlib.exe
          else
            ./bin/check_jsonlib
          fi
